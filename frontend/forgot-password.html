<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="assets/css/app-enhancements.css">
  <script src="assets/js/ui-feedback.js"></script>
  <script src="assets/js/app-enhancements.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — eSaka</title>
<script src="assets/js/config.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --green-primary: #0B382A;
    --green-dark: #14532D;
    --gold: #EAB308;
    --muted: #202824;
    --bean-sprout: #FFFFFF;
    --endive: #D9E4DE;
    --radicchio: #C0392B;
    --error: #C0392B;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
    color: var(--green-dark);
  }

  /* ==========================================================
     BACKGROUND SLIDESHOW (same sa landing page)
     ========================================================== */
  .bg-slideshow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .bg-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  .bg-slide.active {
    opacity: 1;
  }

  .bg-slide:nth-child(1) { background-image: url('images/esakabg.jpg'); }
  .bg-slide:nth-child(2) { background-image: url('images/esakabg2.jpg'); }
  .bg-slide:nth-child(3) { background-image: url('images/esakabg3.avif'); }

  /* ==========================================================
     MAIN CARD LAYOUT
     ========================================================== */
  .landing-card-layout {
    width: 100%;
    max-width: 520px;
    background: rgba(255, 255, 255, 0.58);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(11, 56, 42, 0.3);
    border: 1px solid rgba(217, 228, 222, 0.8);
    display: flex;
    flex-direction: column;
    z-index: 1;
    position: relative;
  }

  /* ==========================================================
     HERO HEADER (green section na may logo)
     ========================================================== */
  .hero-header {
    background: rgba(11, 56, 42, 0.68);
    padding: 40px 30px 50px 30px;
    color: #ffffff;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .brand-logo-img {
    width: 150px;
    height: auto;
    object-fit: contain;
    margin-bottom: 16px;
    filter: brightness(0) invert(1);
  }

  .hero-title {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .hero-desc {
    font-size: 14px;
    line-height: 1.55;
    color: var(--bean-sprout);
    font-weight: 500;
    max-width: 400px;
  }

  /* ==========================================================
     FORM SECTION (overlapping sa hero)
     ========================================================== */
  .form-container {
    padding: 0 30px 30px 30px;
    margin-top: -24px;
    position: relative;
    z-index: 2;
  }

  .form-card {
    background: rgba(255, 255, 255, 0.76);
    border: 1px solid rgba(217, 228, 222, 0.75);
    border-radius: 18px;
    padding: 30px 28px 26px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  }

  .field {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--green-dark);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    padding: 13px 16px;
    font-size: 14.5px;
    font-family: inherit;
    border: 1.5px solid rgba(32, 40, 36, 0.2);
    border-radius: var(--radius-sm);
    background: #ffffff;
    color: var(--green-dark);
    outline: none;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }

  .field input::placeholder {
    color: rgba(32, 40, 36, 0.55);
  }

  .field input:focus {
    border-color: var(--green-primary);
    box-shadow: 0 0 0 3.5px rgba(11, 56, 42, 0.15);
  }

  .field input.invalid {
    border-color: var(--error);
  }

  .error-msg {
    display: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--error);
    margin-top: 6px;
  }

  .field.has-error .error-msg {
    display: block;
  }

  /* ==========================================================
     BUTTONS
     ========================================================== */
  .button-group {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .btn-back,
  .btn-send {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-back {
    flex: 1;
    border: 2px solid rgba(32, 40, 36, 0.25);
    background: transparent;
    color: var(--green-dark);
  }

  .btn-back:hover {
    background: var(--green-dark);
    border-color: var(--green-dark);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
  }

  .btn-send {
    flex: 2;
    border: 2px solid var(--green-primary);
    background: var(--green-primary);
    color: #ffffff;
  }

  .btn-send:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--green-dark);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
  }

  .btn-send:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
  }

  .home-row {
    text-align: center;
    margin-top: 10px;
  }

  .home-row a {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .home-row a:hover {
    color: var(--green-primary);
    text-decoration: underline;
  }

  /* ==========================================================
     MODAL
     ========================================================== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(11, 56, 42, 0.7);
    backdrop-filter: blur(3px);
    align-items: center;
    justify-content: center;
    z-index: 99999;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal-box {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(217, 228, 222, 0.9);
    border-radius: 18px;
    padding: 34px 40px 30px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    max-width: 440px;
    width: calc(100% - 40px);
  }

  .modal-box h2 {
    font-size: 22px;
    font-weight: 800;
    color: var(--green-primary);
    margin-bottom: 10px;
  }

  .modal-box p {
    font-size: 14.5px;
    color: var(--green-dark);
    margin-bottom: 22px;
    line-height: 1.55;
  }

  .modal-ok {
    border: 2px solid var(--green-primary);
    background: var(--green-primary);
    color: #fff;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    padding: 11px 36px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .modal-ok:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--green-dark);
  }

  /* ==========================================================
     RESPONSIVE
     ========================================================== */
  @media (max-width: 640px) {
    .landing-card-layout {
      max-width: 100%;
    }
    .hero-header {
      padding: 30px 20px 40px 20px;
    }
    .hero-title {
      font-size: 22px;
    }
    .form-container {
      padding: 0 20px 24px 20px;
    }
    .form-card {
      padding: 24px 20px 20px;
    }
    .button-group {
      flex-direction: column-reverse;
    }
    .btn-back,
    .btn-send {
      width: 100%;
    }
  }
</style>
</head>

<body>

<!-- Background Slideshow Layer -->
<div class="bg-slideshow">
  <div class="bg-slide active"></div>
  <div class="bg-slide"></div>
  <div class="bg-slide"></div>
</div>

<div class="landing-card-layout">

  <!-- HERO HEADER -->
  <div class="hero-header">
    <img src="images/esakaname.png" alt="eSaka Logo" class="brand-logo-img">
    <h1 class="hero-title">Forgot Password</h1>
    <p class="hero-desc">
      Enter your registered email address and we'll send you a password reset link.
    </p>
  </div>

  <!-- FORM SECTION -->
  <div class="form-container">
    <div class="form-card">
      <form id="resetForm" novalidate>
        <div class="field" id="emailField">
          <label for="resetEmail">Email Address</label>
          <input
            type="email"
            id="resetEmail"
            placeholder="e.g. user@organization.com"
            autocomplete="email"
          >
          <p class="error-msg" id="emailError">
            Please enter a valid email address.
          </p>
        </div>

        <div class="button-group">
          <button type="button" class="btn-back" id="backToLoginBtn">
            Back to Login
          </button>
          <button class="btn-send" id="sendButton" type="submit">
            Send Reset Link
          </button>
        </div>

        <div class="home-row">
          <a href="index.html">Return to Homescreen</a>
        </div>
      </form>
    </div>
  </div>

</div>

<!-- EMAIL SENT MODAL -->
<div class="modal-overlay" id="sentModal">
  <div class="modal-box">
    <h2>Email Sent!</h2>
    <p>
      Please check your inbox for instructions to reset your password.
    </p>
    <button class="modal-ok" id="modalOkBtn" type="button">
      OK
    </button>
  </div>
</div>

<script>
  const API_BASE_URL = window.API_BASE_URL || "https://esaka-backend-production.up.railway.app";

  const resetForm = document.getElementById("resetForm");
  const emailField = document.getElementById("emailField");
  const resetEmail = document.getElementById("resetEmail");
  const sentModal = document.getElementById("sentModal");
  const sendButton = document.getElementById("sendButton");
  const backToLoginBtn = document.getElementById("backToLoginBtn");

  // Background Slideshow
  const slides = document.querySelectorAll('.bg-slide');
  let currentSlide = 0;

  function nextSlide() {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
  }

  setInterval(nextSlide, 4000);

  // Back button
  backToLoginBtn.addEventListener("click", function() {
    window.location.href = "login.html";
  });

  // Submit reset form
  resetForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = resetEmail.value.trim();
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!email || !emailPattern.test(email)) {
      emailField.classList.add("has-error");
      resetEmail.classList.add("invalid");
      return;
    }

    emailField.classList.remove("has-error");
    resetEmail.classList.remove("invalid");

    sendButton.disabled = true;
    sendButton.textContent = "Sending...";

    try {
      const response = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email_address: email
        })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.detail || "Unable to send password reset email.");
        return;
      }

      sentModal.classList.add("show");

    } catch (error) {
      console.error("Forgot password error:", error);
      alert("Unable to connect to the eSaka server.");
    } finally {
      sendButton.disabled = false;
      sendButton.textContent = "Send Reset Link";
    }
  });

  document.getElementById("modalOkBtn").addEventListener("click", function() {
    window.location.href = "login.html";
  });
</script>

</body>
</html>
